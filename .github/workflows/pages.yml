name: Publish AlphaFlow preview
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '50 23,0,13,15 * * *'
    - cron: '10 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run sync
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: public
      - name: Wait for this attempt's Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq "[.artifacts[] | select(.name == \"$PAGES_ARTIFACT_NAME\")] | length")"
            if [[ "$count" == "1" ]]; then
              echo "This attempt's Pages artifact is available."
              exit 0
            fi
            if [[ "$count" != "0" ]]; then
              echo "Unexpected artifact count for this attempt: $count"
              exit 1
            fi
            sleep 5
          done
          echo "This attempt's Pages artifact was not visible within 60 seconds."
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
